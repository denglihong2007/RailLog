name: Deploy API

# 只发布后端：不重建安装包、不动 GitHub Release。
# release.yml 只在 app/pubspec.yaml 变化时触发，后端改动推送后不会自动上线，
# 需要上线时手动运行本工作流。
#
# 构建仍然在 GitHub 托管的 runner 上（NuGet 在境外），落地在 156.254.6.59
# 注册的自建 runner 上：部署目标就在本机，不需要 sshpass / SCP。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 指定 win-x64 只带 Windows 的原生库；不加 RID 会连 Linux/macOS 的
      # SkiaSharp 一起打进来，光 PDB 就 270 MB。
      - name: Publish API
        run: dotnet publish api/RailLog.API.csproj -c Release -r win-x64 --self-contained false -o out

      # - web.config：服务器上的那份存着 SMTP、GitHub token 等环境变量，
      #   发布包自带的只有一行 aspNetCore handler，覆盖过去会丢配置。
      # - libSkiaSharp.pdb：91 MB，生产环境用不上。
      - name: Strip web.config and PDBs
        run: |
          set -euo pipefail
          rm -f out/web.config
          find out -name '*.pdb' ! -name 'RailLog.API.pdb' -delete

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: out
          if-no-files-found: error
          retention-days: 1

  deploy-api:
    name: Deploy API to IIS
    needs: build-api
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    # 与 release.yml 的两个部署作业共用一个组，避免同时往站点目录写
    concurrency:
      group: deploy-iis
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # 工作区常驻在服务器上，别把 token 留在 .git/config 里
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: api
          path: dist/api

      # 脚本要求 Windows PowerShell 5.1（WebAdministration 是 5.1 才有的快照），
      # 所以用 powershell.exe 调用，不能直接交给 pwsh。
      - name: Deploy
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tools\deploy\deploy-iis.ps1" `
            -SourceDirectory "$env:GITHUB_WORKSPACE\dist\api" `
            -Profile api
          if ($LASTEXITCODE -ne 0) { throw "deploy-iis.ps1 exited with $LASTEXITCODE" }
