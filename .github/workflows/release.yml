name: Build and release

on:
  push:
    branches:
      - master
    paths:
      - app/pubspec.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Read pubspec version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)(\+.*)?[[:space:]]*$/\1/p' app/pubspec.yaml | head -n1)
          if [[ -z "$version" ]]; then
            echo "Could not read a semantic version from app/pubspec.yaml" >&2
            exit 1
          fi

          changed=true
          if [[ "${{ github.event_name }}" == "push" ]] && git cat-file -e "${{ github.event.before }}:app/pubspec.yaml" 2>/dev/null; then
            previous=$(git show "${{ github.event.before }}:app/pubspec.yaml" | sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)(\+.*)?[[:space:]]*$/\1/p' | head -n1)
            [[ "$version" != "$previous" ]] || changed=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build-android:
    name: Android (all ABIs)
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/app/android/upload-keystore.jks"
          } > app/android/key.properties
      - name: Build APK
        working-directory: app
        run: flutter build apk --release --split-per-abi
      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/raillog-${{ needs.prepare.outputs.tag }}-android-armeabi-v7a.apk"
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/raillog-${{ needs.prepare.outputs.tag }}-android-arm64-v8a.apk"
          cp app/build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/raillog-${{ needs.prepare.outputs.tag }}-android-x86_64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  build-linux:
    name: Linux
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Linux
        working-directory: app
        run: flutter config --enable-linux-desktop && flutter build linux --release
      - name: Package Linux
        run: |
          mkdir -p dist
          tar -C app/build/linux/x64/release -czf "dist/raillog-${{ needs.prepare.outputs.tag }}-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  build-windows:
    name: Windows
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows
        working-directory: app
        shell: pwsh
        run: flutter config --enable-windows-desktop; flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path app\build\windows\x64\runner\Release\* -DestinationPath "raillog-${{ needs.prepare.outputs.tag }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: '*.zip'

  build-macos:
    name: macOS (arm64)
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS
        working-directory: app
        run: flutter config --enable-macos-desktop && flutter build macos --release
      - name: Package macOS
        run: |
          macos_app=$(find app/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$macos_app"
          ditto -c -k --sequesterRsrc --keepParent "$macos_app" "raillog-${{ needs.prepare.outputs.tag }}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: '*.zip'

  build-ios:
    name: iOS (unsigned)
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS
        working-directory: app
        run: flutter build ios --release --no-codesign
      - name: Package iOS app
        run: |
          ios_app=app/build/ios/iphoneos/Runner.app
          test -d "$ios_app"
          mkdir -p Payload
          cp -R "$ios_app" Payload/
          ditto -c -k --sequesterRsrc Payload "raillog-${{ needs.prepare.outputs.tag }}-ios.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: '*.ipa'

  release:
    name: Create GitHub release
    needs: [prepare, build-android, build-linux, build-windows, build-macos, build-ios]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body: ''
          files: dist/*
          generate_release_notes: false

  upload-storage:
    name: Upload builds to object storage
    needs: [prepare, release]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 官网的「官方下载」按钮直接指向这里，路径与文件名要和
      # web/src/App.vue 里拼出来的一致：v<version>/raillog-v<version>-<平台>。
      # 桶已开放匿名读，不需要额外设置 ACL。
      # Windows 从微软商店分发，zip 只留在 GitHub Release，不占对象存储。
      #
      # GitHub runner 直连 RainS3 跨境只有约 100 B/s，aws s3 cp 传不完；
      # 改为先 SCP 到 IIS 服务器，再由服务器上传。runner → 服务器的链路是通的。
      - name: Package assets
        run: |
          set -euo pipefail
          cd dist
          zip -qry ../raillog-assets.zip . -x '*-windows-*'

      # 服务器上没有 AWS CLI 时用它安装；从 runner 下载，避免服务器访问境外站点。
      - name: Download AWS CLI installer
        run: curl -fsSL https://awscli.amazonaws.com/AWSCLIV2.msi -o AWSCLIV2.msi

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          cp .github/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload through IIS server
        env:
          SSHPASS: ${{ secrets.IIS_SSH_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          umask 077
          printf 'AWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > s3-upload.env

          sshpass -e scp -P 22 -q \
            -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
            raillog-assets.zip AWSCLIV2.msi s3-upload.env \
            tools/deploy/upload-storage.ps1 \
            Administrator@156.254.6.59:

          sshpass -e ssh -p 22 \
            -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
            Administrator@156.254.6.59 \
            'powershell -NoProfile -ExecutionPolicy Bypass -File C:/Users/Administrator/upload-storage.ps1 -ZipPath C:/Users/Administrator/raillog-assets.zip -InstallerPath C:/Users/Administrator/AWSCLIV2.msi -CredentialsPath C:/Users/Administrator/s3-upload.env -Tag ${{ needs.prepare.outputs.tag }}'

      # 脚本解析失败或连接中断时，服务端的 finally 不会执行，补一步兜底清理。
      - name: Remove temporary server files
        if: always()
        env:
          SSHPASS: ${{ secrets.IIS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null 2>&1 || exit 0
          sshpass -e ssh -p 22 \
            -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
            Administrator@156.254.6.59 \
            'powershell -NoProfile -Command "Remove-Item -LiteralPath C:/Users/Administrator/raillog-assets.zip,C:/Users/Administrator/AWSCLIV2.msi,C:/Users/Administrator/s3-upload.env -Force -ErrorAction SilentlyContinue"'

  deploy-api:
    name: Deploy API to IIS
    needs: [prepare, release]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # 两个部署作业共用这个组，避免同时往服务器传同名脚本、同时写站点目录
    concurrency:
      group: deploy-iis
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 指定 win-x64 只带 Windows 的原生库；不加 RID 会连 Linux/macOS 的
      # SkiaSharp 一起打进来，光 PDB 就 270 MB。
      - name: Publish API
        run: dotnet publish api/RailLog.API.csproj -c Release -r win-x64 --self-contained false -o out

      # - web.config：服务器上的那份存着 SMTP、GitHub token 等环境变量，
      #   发布包自带的只有一行 aspNetCore handler，覆盖过去会丢配置。
      # - libSkiaSharp.pdb：91 MB，生产环境用不上。
      - name: Strip web.config and PDBs
        run: |
          set -euo pipefail
          rm -f out/web.config
          find out -name '*.pdb' ! -name 'RailLog.API.pdb' -delete

      - name: Package
        run: |
          set -euo pipefail
          cd out
          zip -qry ../raillog-api.zip .

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          cp .github/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload package and deploy
        env:
          SSHPASS: ${{ secrets.IIS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e scp -P 22 -q \
            -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
            raillog-api.zip tools/deploy/deploy-iis.ps1 \
            Administrator@156.254.6.59:
          sshpass -e ssh -p 22 \
            -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
            Administrator@156.254.6.59 \
            'powershell -NoProfile -ExecutionPolicy Bypass -File C:/Users/Administrator/deploy-iis.ps1 -ZipPath C:/Users/Administrator/raillog-api.zip -Profile api'

  deploy-web:
    name: Deploy website to IIS
    # 官网把官方下载指向对象存储，等上传成功再发布，避免短时间里链接 404
    needs: [prepare, release, upload-storage]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-iis
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm run build = vue-tsc 类型检查 + vite build + vitepress build
      # 产物在 web/dist，api-docs 会落在 web/dist/api-docs
      - name: Build website
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          set -euo pipefail
          cd web/dist
          zip -qry ../../raillog-web.zip .

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          cp .github/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload package and deploy
        env:
          SSHPASS: ${{ secrets.IIS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e scp -P 22 -q \
            -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
            raillog-web.zip tools/deploy/deploy-iis.ps1 \
            Administrator@156.254.6.59:
          sshpass -e ssh -p 22 \
            -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 \
            Administrator@156.254.6.59 \
            'powershell -NoProfile -ExecutionPolicy Bypass -File C:/Users/Administrator/deploy-iis.ps1 -ZipPath C:/Users/Administrator/raillog-web.zip -Profile web'
